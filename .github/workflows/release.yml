name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Prepare signing config
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/ilta-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/ilta-release.jks
          storePassword=$RELEASE_STORE_PASSWORD
          keyAlias=ilta
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease \
            -PupdateRepo=${{ github.repository }} \
            --no-daemon

      - name: Prepare release artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/IlTa-${GITHUB_REF_NAME}-release.apk"
          cd artifacts
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: IlTa ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## IlTa ${{ github.ref_name }}

            Встроенная проверка обновлений: приложение предложит установить эту версию.
            APK подписан release-ключом IlTa; установка идёт через системный установщик.

            Полный список изменений: https://github.com/${{ github.repository }}/commits/${{ github.ref_name }}
          files: |
            artifacts/*.apk
            artifacts/checksums.txt
